start_sleep:
  name: Start sleep session
  description: Begin tracking a sleep session for a tracker.
  fields:
    tracker_id:
      name: Tracker ID
      description: The tracker ID (HA user ID for personal trackers, UUID for shared trackers like a baby).
      required: true
      selector:
        text:
    source:
      name: Source
      description: What triggered this (e.g., "automation", "phone_sensor").
      required: false
      default: automation
      selector:
        text:
    automation_id:
      name: Automation ID
      description: Optional. The calling automation's entity_id, typically `{{ this.entity_id }}`. Stored on the resume event if this call resumes a paused session.
      required: false
      selector:
        text:
    automation_trigger_id:
      name: Automation trigger ID
      description: Optional. The id of the matched trigger within the automation, typically `{{ trigger.id }}`.
      required: false
      selector:
        text:

stop_sleep:
  name: Stop sleep session
  description: End the active sleep session for a tracker. Phases are materialized and the session becomes editable.
  fields:
    tracker_id:
      name: Tracker ID
      description: The tracker ID.
      required: true
      selector:
        text:
    source:
      name: Source
      description: What triggered this.
      required: false
      default: automation
      selector:
        text:

pause_sleep:
  name: Pause sleep session
  description: Pause the active sleep session. The tracker is marked as awake until the session is resumed via start_sleep.
  fields:
    tracker_id:
      name: Tracker ID
      description: The tracker ID.
      required: true
      selector:
        text:
    source:
      name: Source
      description: What triggered this.
      required: false
      default: automation
      selector:
        text:
    automation_id:
      name: Automation ID
      description: Optional. The calling automation's entity_id, typically `{{ this.entity_id }}`. Stored on the pause event.
      required: false
      selector:
        text:
    automation_trigger_id:
      name: Automation trigger ID
      description: Optional. The id of the matched trigger within the automation, typically `{{ trigger.id }}`.
      required: false
      selector:
        text:

reopen_session:
  name: Reopen sleep session
  description: Reopen a stopped (but not finalized) session, allowing new events to be appended again. Clears the materialized phases.
  fields:
    tracker_id:
      name: Tracker ID
      description: The tracker ID that owns the session.
      required: true
      selector:
        text:
    session_id:
      name: Session ID
      description: The UUID of the session to reopen.
      required: true
      selector:
        text:

event_awake:
  name: Event - Awake
  description: Record an "awake" event during sleep. The tracker just woke up after being asleep. Auto-demoted to "still_awake" if currently still in the awake state.
  fields:
    tracker_id:
      name: Tracker ID
      description: The tracker ID.
      required: true
      selector:
        text:
    source:
      name: Source
      description: What detected the wakeup (e.g., "phone_sensor", "button").
      required: false
      default: automation
      selector:
        text:
    automation_id:
      name: Automation ID
      description: Optional. The calling automation's entity_id, typically `{{ this.entity_id }}`. Stored on the event.
      required: false
      selector:
        text:
    automation_trigger_id:
      name: Automation trigger ID
      description: Optional. The id of the matched trigger within the automation, typically `{{ trigger.id }}`.
      required: false
      selector:
        text:

event_still_awake:
  name: Event - Still Awake
  description: Record a "still awake" event. Confirms the tracker has been awake since the last event, extending the awake window.
  fields:
    tracker_id:
      name: Tracker ID
      description: The tracker ID.
      required: true
      selector:
        text:
    source:
      name: Source
      description: What detected the continued wakefulness.
      required: false
      default: automation
      selector:
        text:
    automation_id:
      name: Automation ID
      description: Optional. The calling automation's entity_id, typically `{{ this.entity_id }}`. Stored on the event.
      required: false
      selector:
        text:
    automation_trigger_id:
      name: Automation trigger ID
      description: Optional. The id of the matched trigger within the automation, typically `{{ trigger.id }}`.
      required: false
      selector:
        text:

event_fell_asleep:
  name: Event - Fell Asleep
  description: Record a "fell asleep" event. Forces an immediate awake-to-asleep transition at the event timestamp, bypassing the latency model. Useful for sleep ring/sensor integrations.
  fields:
    tracker_id:
      name: Tracker ID
      description: The tracker ID.
      required: true
      selector:
        text:
    source:
      name: Source
      description: What detected the sleep onset (e.g., "sleep_ring").
      required: false
      default: automation
      selector:
        text:
    automation_id:
      name: Automation ID
      description: Optional. The calling automation's entity_id, typically `{{ this.entity_id }}`. Stored on the event.
      required: false
      selector:
        text:
    automation_trigger_id:
      name: Automation trigger ID
      description: Optional. The id of the matched trigger within the automation, typically `{{ trigger.id }}`.
      required: false
      selector:
        text:

export_session:
  name: Export session
  description: Export a completed sleep session to the configured REST endpoint.
  fields:
    session_id:
      name: Session ID
      description: The UUID of the session to export.
      required: true
      selector:
        text:
